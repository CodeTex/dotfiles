add_newline = false
scan_timeout = 500
command_timeout = 3600

format = """
$os\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[line_break]
disabled = false

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[cmd_duration]
min_time = 1000
show_milliseconds = true
format = "[$duration](bright-black)"

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"

[os]
disabled = false
format = "[$symbol](bold white) "

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Debian = "󰣚"
Arch = "󰣇"
Linux = "󰌽"
Unknown = "?"

# [username]
# show_always = true
# format = "[ $user ]($style)"
